theme = "gruvbox"

[editor]
line-number = "relative"
mouse = true
scrolloff = 10
bufferline = "always"
auto-save = true
completion-trigger-len = 1
auto-format = true
true-color = true

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = false
git-global = false

[editor.indent-guides]
render = true
character = "┊"

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]

# Akıllı sekme (smart-tab) ayarları.
# DÜZELTME: BÜYÜK harfli 'TAB' yerine küçük harfli 'tab' kullanıldı.
[keys.normal]
tab = "smart_tab"


[keys.insert]
tab = "smart_tab"
